<!DOCTYPE html>
<html lang="en">
{{> head}}
<body class="{{bodyClass}}">
    {{> header}}

    <main class="site-main">
        <div class="container">
            {{#content}}
            <div class="page-content blog-intro">
                {{content}}
            </div>
            {{/content}}

            {{#showPostsList}}
            <section class="posts-list" aria-label="Blog posts">
                {{postsList}}
            </section>
            {{/showPostsList}}
        </div>
    </main>

    {{> footer}}
</body>
</html>
