<!DOCTYPE html>
<html lang="en">
{{> head}}
<body class="{{bodyClass}}">
    {{> header}}

    <main class="site-main">
        <div class="container">
            {{#content}}
            <div class="row">
                <div class="col-12 page-content blog-intro">
                    {{content}}
                </div>
            </div>
            {{/content}}

            <div class="row">
                <div class="col-12">
                    <section class="posts-list" aria-label="Blog posts">
                        {{postsList}}
                    </section>
                </div>
            </div>
        </div>
    </main>

    {{> footer}}
</body>
</html>
