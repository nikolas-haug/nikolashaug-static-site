<!DOCTYPE html>
<html lang="en">
{{> head}}
<body>
    {{> header}}
    {{> nav}}

    <main class="site-main">
        {{#heroImage}}
        <div class="hero-image">
            <img src="{{heroImage}}" alt="{{title}}" class="img-100">
        </div>
        {{/heroImage}}

        <article class="post-article">
            <header class="post-header">
                <h1 class="post-title">{{title}}</h1>
                {{#postDate}}
                <time class="post-date" datetime="{{postDate}}">{{postDate}}</time>
                {{/postDate}}
            </header>

            <div class="post-content">
                {{content}}
            </div>

            <footer class="post-footer">
                <a href="../blog/" class="back-to-blog">&larr; Back to Blog</a>
            </footer>
        </article>
    </main>

    {{> footer}}
</body>
</html>
